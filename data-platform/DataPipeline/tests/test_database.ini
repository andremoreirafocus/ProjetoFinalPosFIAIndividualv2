# Dedicated test database configuration — single source of truth for the suite.
#
# Targets a database on the local project PostgreSQL that is used ONLY by tests
# and is distinct from the pipeline database. The suite authenticates as the
# least-privilege role 'data_test_user' (provisioned by
# postgres/init/02-create-test-role-and-db.sql), which cannot connect to the
# pipeline database 'data'. Local/demo credentials, versioned like
# data-platform/.env. conftest.py requires every key below and fails loudly if
# the file or any key is missing — there is no environment fallback.
[test_database]
host = localhost
port = 5432
user = data_test_user
password = data_test
dbname = data_test
pipeline_dbname = data
