# Dedicated test database configuration — single source of truth for the suite.
#
# Targets a database on the local project PostgreSQL that is used ONLY by tests
# and is distinct from the pipeline database. Local/demo credentials, versioned
# like data-platform/.env. conftest.py requires every key below and fails loudly
# if the file or any key is missing — there is no environment fallback.
[test_database]
host = localhost
port = 5432
user = airflow
password = airflow
dbname = data_test
pipeline_dbname = data
